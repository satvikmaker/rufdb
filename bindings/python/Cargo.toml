[package]
name = "rufdb-python"
version = "0.1.0"
edition = "2021"
description = "Python bindings for rufdb — a fast, file-system based JSON database"
license = "MIT"

[lib]
name = "rufdb_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
rufdb = { path = "../..", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
