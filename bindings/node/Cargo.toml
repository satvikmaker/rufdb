[package]
name = "rsdb-node"
version = "0.1.0"
edition = "2021"
description = "Node.js bindings for rsdb — a fast, file-system based JSON database"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi6", "serde-json"] }
napi-derive = "2"
rsdb = { path = "../..", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"
