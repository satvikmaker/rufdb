[package]
name = "rsdb"
version = "0.1.0"
edition = "2021"
authors = ["rsdb contributors"]
description = "A small, fast, file-system based JSON database for Rust — inspired by lowdb, written in pure Rust"
license = "MIT"
repository = "https://github.com/plandex-ai/rsdb"
keywords = ["database", "json", "file", "lowdb", "embedded"]
categories = ["database-implementations", "filesystem"]

[lib]
name = "rsdb"
path = "src/lib.rs"
# Only "lib" by default. Build with --features ffi for cdylib/staticlib:
#   cargo build --release --features ffi
# The cdylib/staticlib outputs are produced by the bindings/ sub-crates
# (bindings/node and bindings/python) which set their own crate-type.

[[bin]]
name = "rsdb"
path = "src/bin/cli.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"], optional = true }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }

[features]
default = ["async"]
async = ["tokio"]
ffi = []
wasm = []
